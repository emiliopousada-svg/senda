name: Compilar APK Android Senda

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Permite ejecutar la compilación manualmente desde la web de GitHub

jobs:
  build-apk:
    name: Generar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Instalar dependencias npm
        run: npm ci

      - name: 6. Compilar frontend Vite
        run: npm run build

      - name: 7. Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: 8. Dar permisos de ejecución a gradlew
        run: chmod +x android/gradlew

      - name: 9. Compilar APK Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 10. Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Senda-GPS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
